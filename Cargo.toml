[workspace]
# The browser (root package) plus ychrome's own crates. A libyggterm app owns
# its capabilities: the vault client lives here, not in yggterm.
#
# `ychrome-vault` is the crypto-heavy Bitwarden client + agent. `ychrome-vault-proto`
# is JUST the agent's unix-socket wire (no crypto, no http): the browser links it
# to talk to the vault agent directly instead of spawning the `ychrome-vault` CLI.
members = ["crates/ychrome-vault", "crates/ychrome-vault-proto"]
# `cargo build` at the root builds only the browser (lean, strip+lto); the vault
# crate is built explicitly (`-p ychrome-vault`) so its crypto/http deps don't
# weigh on the browser build. The proto crate is tiny and rides with the browser.
default-members = ["."]

[package]
name = "ychrome"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
description = "A minimal profile-aware web viewport for the Yggdrasil ecosystem — multi-account browsing and ssh-tunneled localhost views, and the libyggterm pilot app"
repository = "https://github.com/yggdrasilhq/ychrome"

[dependencies]
anyhow = "1"
base64 = "0.22"
# The agent engine's substrate (docs/agent-engine.md §9.1). These are the
# gir-generated bindings wry already links against — same versions, resolved by
# the same lockfile entries — so the engine adds a module, not a toolchain.
cairo-rs = { version = "0.18", features = ["png"] }
clap = { version = "4", features = ["derive"] }
# `termination` so SIGTERM reaches the daemon's handler too: a deploy or a
# `kill` is exactly when an unreaped Xvfb gets left behind, and plain SIGINT
# (the default feature set) never fires for either.
ctrlc = { version = "3", features = ["termination"] }
dirs = "5"
# Pure-Rust (miniz_oxide) inflate for the bundled adblock ruleset, which is
# 19 MB of JSON and 1.9 MB gzipped. No C toolchain, no TLS, nothing that
# weighs on the browser build the way the vault crate's deps would.
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
gdk = "0.18"
gio = "0.18"
glib = "0.18"
gtk = "0.18"
javascriptcore-rs = "1.1"
# `_exit` only: the engine must end the process without libc's exit handlers,
# because WebKit's runs after the main loop is gone. See engine::exit_now.
libc = "0.2"
serde_json = "1"
# The vault agent's client transport — crypto-free, so the browser stays lean.
# The sidebar's vault pane and the passkey signer speak the agent socket through
# this instead of shelling out to the `ychrome-vault` CLI.
ychrome-vault-proto = { path = "crates/ychrome-vault-proto" }
# SHA-256 for the WebAuthn clientDataHash the passkey signer computes before it
# asks the vault agent to sign. The signing crypto itself lives in ychrome-vault.
sha2 = "0.10"
tao = "0.35"
# The same soup3 webkit2gtk itself builds against — `CookieManagerExt::add_cookie`
# takes a `soup::Cookie`, and webkit2gtk does not re-export the crate.
soup = { package = "soup3", version = "0.5" }
url = "2"
# `v2_40` is what `webkit_web_view_evaluate_javascript` needs; wry already
# turns on v2_38, so this is one additive step on a shared dependency.
webkit2gtk = { version = "2.0", features = ["v2_40"] }
wry = "0.55"

[profile.release]
strip = true
lto = "thin"
